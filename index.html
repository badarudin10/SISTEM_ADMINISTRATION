<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asisten LPT Distribusi Obat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen p-6">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="flex justify-between items-center pb-6 border-b border-slate-200 dark:border-slate-800">
      <div>
        <h1 class="text-2xl font-bold text-sky-600 dark:text-sky-400">
          Asisten LPT Distribusi Obat
        </h1>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
          Sistem Pengelolaan Laporan Pemakaian dan Permintaan Obat
        </p>
      </div>
      <button onclick="document.documentElement.classList.toggle('dark')" class="px-4 py-2 text-sm font-semibold rounded-lg bg-sky-600 text-white hover:bg-sky-700 transition">
        🌙 / ☀️ Switch Theme
      </button>
    </header>

    <!-- Content -->
    <main class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="p-5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800 shadow-sm">
        <h2 class="text-lg font-bold mb-2">Status Sistem</h2>
        <p class="text-sm text-emerald-600 dark:text-emerald-400 font-medium">
          ● Berhasil terhubung & aktif di GitHub Pages
        </p>
      </div>

      <div class="p-5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800 shadow-sm">
        <h2 class="text-lg font-bold mb-2">Informasi Akses</h2>
        <p class="text-sm text-slate-600 dark:text-slate-300">
          Repository: <code class="bg-slate-100 dark:bg-slate-700 px-2 py-1 rounded">SISTEM_ADMINISTRATION</code>
        </p>
      </div>
    </main>

  </div>
</body>
</html>
